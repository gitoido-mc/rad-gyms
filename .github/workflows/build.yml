#file: noinspection SpellCheckingInspection
name: Build and publish project artifacts on platforms
on:
  release:
    types:
      - published
  workflow_dispatch:

env:
  project_slug: rad-gyms
  curseforge_id: 1196570
  modrinth_id: eF8kqlHd
  minecraft: 1.21.1
  cobblemon: 1.8.3
  rctapi: 0.16.2-beta

jobs:
  build:
    name: "Build mod jars"
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    strategy:
      matrix:
        # Use these Java versions
        java: [
          21,    # Current Java LTS
        ]
        loader: [
          fabric,
          neoforge,
        ]
    steps:
      - name: Setup workspace
        uses: actions/checkout@v7
      - name: Setup jdk ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
      - name: Validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: Setup gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build
        run: ./gradlew :x-${{ matrix.loader }}:build
      - name: Save version output
        id: version
        run: echo "MOD_VERSION=$(./gradlew currentVersion -q -Prelease.quiet)" >> "$GITHUB_OUTPUT"
      - name: "Publish on platforms"
        if: github.event_name == 'release'
        uses: Kira-NT/mc-publish@v3.3
        with:
          name: "Rad Gyms ${{ steps.version.outputs.MOD_VERSION }} for Cobblemon ${{ env.cobblemon }}"
          java: ${{ matrix.java }}
          game-versions: ${{ env.minecraft }}
          loaders: ${{ matrix.loader }}

          files: |
            ./x-${{matrix.loader}}/build/libs/${{ env.project_slug }}-${{ matrix.loader }}-${{ steps.version.outputs.MOD_VERSION }}.jar
            ./x-${{matrix.loader}}/build/libs/${{ env.project_slug }}-${{ matrix.loader }}-${{ steps.version.outputs.MOD_VERSION }}-sources.jar

          version: "${{ env.cobblemon }}_${{ steps.version.outputs.MOD_VERSION }}"
          version-type: release
          environment: client | server

          github-token: ${{ secrets.GITHUB_TOKEN }}

          curseforge-id: ${{ env.curseforge_id }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          modrinth-id: ${{ env.modrinth_id }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          dependencies: |
            architectury-api(required){curseforge:419699}{modrinth:lhGA9TYQ}
            cobblemon@${{ env.cobblemon }}(required){curseforge:687131}{modrinth:MdwFAVRL}
            radical-cobblemon-trainers-api@${{ env.rctapi }}(required){curseforge:1152792}{modrinth:CBfM2yw7}
      - name: "Publish on GitHub"
        if: github.event_name == 'workflow_dispatch'
        uses: Kira-NT/mc-publish@v3.3
        with:
          name: "Nightly ${{ steps.version.outputs.MOD_VERSION }}"
          java: ${{ matrix.java }}
          game-versions: ${{ env.minecraft }}
          loaders: ${{ matrix.loader }}

          github-prerelease: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: 'nightly'
          files: |
            ./x-${{matrix.loader}}/build/libs/${{ env.project_slug }}-${{ matrix.loader }}-${{ steps.version.outputs.MOD_VERSION }}.jar
            ./x-${{matrix.loader}}/build/libs/${{ env.project_slug }}-${{ matrix.loader }}-${{ steps.version.outputs.MOD_VERSION }}-sources.jar
